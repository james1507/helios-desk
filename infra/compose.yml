name: helios-desk
services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-helios-local-db-only}
    ports: ["127.0.0.1:5455:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: {context: ./minio}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: helios-local
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-helios-local-storage-only}
    ports: ["127.0.0.1:9005:9000", "127.0.0.1:9006:9001"]
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
  minio-init:
    build: {context: ./mc}
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD:-helios-local-storage-only}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 helios-local $$MINIO_PASSWORD && mc mb --ignore-existing local/helios-private && mc anonymous set none local/helios-private"]
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    build: {context: ../apps/api}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/helios
      DATABASE_USER: helios
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-helios-local-db-only}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-HeliosDemo!2026}
      COOKIE_SECURE: 'false'
      PORT: 8085
    ports: ["127.0.0.1:8085:8085"]
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9085/actuator/health/readiness"]
      interval: 10s
      timeout: 4s
      start_period: 60s
      retries: 20
  web:
    build: {context: ../apps/web}
    environment:
      API_ORIGIN: http://api:8085
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
volumes:
  postgres-data:
  objects:
