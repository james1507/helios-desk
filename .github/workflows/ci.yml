name: Verify Helios Desk
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./mvnw -B spotless:check verify
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/web
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/compose.yml up --build -d --wait --wait-timeout 240
      - run: npm ci && npx playwright install --with-deps chromium && npm run e2e
        working-directory: apps/web
      - run: make contract && git diff --exit-code -- packages/api-contract/openapi.json apps/web/lib/schema.d.ts
      - if: failure()
        run: docker compose -f infra/compose.yml logs --tail 150
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: browser-evidence, path: apps/web/playwright-report, retention-days: 7}
