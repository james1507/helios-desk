spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5455/helios}
    username: ${DATABASE_USER:helios}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8085}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: HELIOS_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  server:
    port: ${MANAGEMENT_PORT:9085}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
helios:
  demo-password: ${DEMO_PASSWORD:}
